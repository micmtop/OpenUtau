name: Package

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release from the artifacts'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,   os: windows-latest,  rid: win-x64 }
          - { name: osx-arm64, os: macos-latest,    rid: osx-arm64 }
          - { name: linux-x64, os: ubuntu-latest,   rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Upstream OpenUtau
        uses: actions/checkout@v4
        with:
          repository: OpenUtau/OpenUtau
          ref: '0.1.576'
          path: upstream

      - name: Overlay
        uses: actions/checkout@v4
        with:
          ref: diffical
          path: overlay

      - name: Engine
        uses: actions/checkout@v4
        with:
          repository: micmtop/diffical
          ref: master
          path: engine

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - name: Build engine
        shell: bash
        run: cargo build --release --manifest-path engine/rust/Cargo.toml

      - name: Apply Diffical
        shell: bash
        run: python overlay/apply.py upstream

      - name: Publish (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          dotnet publish upstream/OpenUtau -c Release -r ${{ matrix.rid }} --self-contained true -o out/${{ matrix.name }}
          bash overlay/mac/make_app.sh out/${{ matrix.name }} out/OpenUtau.app
          ROOT=out/OpenUtau.app/Contents/Resources/Diffical

      - name: Publish (win/linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          dotnet publish upstream/OpenUtau -c Release -r ${{ matrix.rid }} --self-contained true -o out/${{ matrix.name }}

      - name: Assemble
        shell: bash
        run: |
          set -e
          BIN=$(find engine/rust/target/release -maxdepth 1 -type f \( -name 'diffical-cli' -o -name 'diffical-cli.exe' \) | head -1)
          echo "engine binary: $BIN"
          file "$BIN" || true
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            ROOT=out/OpenUtau.app/Contents/Resources/Diffical
            mkdir -p "$ROOT/backend" "$ROOT/models"
            cp "$BIN" "$ROOT/backend/diffical-backend"
            cp engine/rust/target/release/*.dylib "$ROOT/backend/" 2>/dev/null || true
            chmod +x "$ROOT/backend/diffical-backend"
            "$ROOT/backend/diffical-backend" --help > /dev/null
          else
            ROOT=out/${{ matrix.name }}/Diffical
            mkdir -p "$ROOT/backend" "$ROOT/models"
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp "$BIN" "$ROOT/backend/diffical-backend.exe"
              cp engine/rust/target/release/*.dll "$ROOT/backend/" 2>/dev/null || true
              "$ROOT/backend/diffical-backend.exe" --help > /dev/null
            else
              cp "$BIN" "$ROOT/backend/diffical-backend"
              cp engine/rust/target/release/*.so* "$ROOT/backend/" 2>/dev/null || true
              chmod +x "$ROOT/backend/diffical-backend"
              LD_LIBRARY_PATH="$ROOT/backend" "$ROOT/backend/diffical-backend" --help > /dev/null
            fi
          fi
          cat > "$ROOT/config.json" <<'JSON'
          {
            "server": { "host": "127.0.0.1", "port": 8573 },
            "engine": { "auto_start": true, "hnsep_mode": "window", "execution_provider": "cpu", "dump_stages": false, "rms_target": 0.13 },
            "models": { "assembler": "models/assembler.onnx", "vocoder": "models/vocoder.onnx", "hnsep": "models/hnsep.onnx" }
          }
          JSON
          curl -fL --retry 3 -o "$ROOT/models/assembler.onnx" https://github.com/micmtop/diffical/releases/download/weights-v1/pointer_fix_single.onnx
          curl -fL --retry 3 -o "$ROOT/models/vocoder.onnx" "https://github.com/micmtop/diffical/releases/download/weights-v1/model.onnx"
          curl -fL --retry 3 -o "$ROOT/models/hnsep.onnx" https://github.com/micmtop/diffical/releases/download/weights-v1/hnsep.onnx || true

      - name: Zip
        shell: bash
        run: |
          set -e
          mkdir -p dist
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            ditto -c -k --sequesterRsrc --keepParent out/OpenUtau.app dist/OpenUtau-Diffical-${{ matrix.name }}.zip
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a dist/OpenUtau-Diffical-${{ matrix.name }}.zip ./out/${{ matrix.name }}/* >/dev/null
          else
            tar -C out/${{ matrix.name }} -czf dist/OpenUtau-Diffical-${{ matrix.name }}.tar.gz .
          fi
          ls -lh dist

      - name: Verify bundle
        shell: bash
        run: |
          set -e
          LIST=/tmp/bundle-list.txt
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            unzip -l dist/OpenUtau-Diffical-${{ matrix.name }}.zip > "$LIST"
            grep -q "OpenUtau.app/Contents/MacOS/OpenUtau" "$LIST"
            grep -q "Resources/Diffical/backend/diffical-backend" "$LIST"
            grep -q "Resources/Diffical/models/assembler.onnx" "$LIST"
            grep -q "Resources/Diffical/models/vocoder.onnx" "$LIST"
            grep -q "Resources/Diffical/models/hnsep.onnx" "$LIST"
            grep -q "Resources/Diffical/config.json" "$LIST"
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z l dist/OpenUtau-Diffical-${{ matrix.name }}.zip > "$LIST"
            grep -q "OpenUtau.exe" "$LIST"
            grep -q "diffical-backend.exe" "$LIST"
            grep -q "onnxruntime.dll" "$LIST" || true
            grep -q "assembler.onnx" "$LIST"
            grep -q "config.json" "$LIST"
          else
            tar -tzf dist/OpenUtau-Diffical-${{ matrix.name }}.tar.gz > "$LIST"
            grep -q "./OpenUtau" "$LIST"
            grep -q "./Diffical/backend/diffical-backend" "$LIST"
            grep -q "./Diffical/models/hnsep.onnx" "$LIST"
            grep -q "./Diffical/config.json" "$LIST"
          fi
          echo "bundle verified"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Diffical-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || inputs.release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          ls -lh out

      - name: Checkout engine for .oudep builder
        uses: actions/checkout@v4
        with:
          repository: micmtop/diffical
          ref: master
          path: engine

      - name: Build model .oudep
        run: |
          set -e
          mkdir -p m
          curl -fL --retry 3 -o m/assembler.onnx https://github.com/micmtop/diffical/releases/download/weights-v1/pointer_fix_single.onnx
          curl -fL --retry 3 -o m/vocoder.onnx https://github.com/micmtop/diffical/releases/download/weights-v1/model.onnx
          curl -fL --retry 3 -o m/hnsep.onnx https://github.com/micmtop/diffical/releases/download/weights-v1/hnsep.onnx
          python engine/tools/make_oudep.py --models m --out out/diffical-models-0.1.0.oudep

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v0.1.576-diffical"
          else
            TAG="${{ github.ref_name }}"
          fi
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "$TAG" out/* --repo "${{ github.repository }}" \
            --title "OpenUtau Diffical ($TAG)" \
            --notes "OpenUtau 0.1.576 + Diffical engine (Rust) + models. Windows/Linux zip, macOS app zip. Weights: CC BY-NC-SA 4.0; code Apache-2.0."
