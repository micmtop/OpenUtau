name: Package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64,   os: windows-latest,  rid: win-x64 }
          - { name: osx-arm64, os: macos-latest,    rid: osx-arm64 }
          - { name: linux-x64, os: ubuntu-latest,   rid: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Upstream OpenUtau
        uses: actions/checkout@v4
        with:
          repository: OpenUtau/OpenUtau
          ref: '0.1.576'
          path: upstream

      - name: Overlay
        uses: actions/checkout@v4
        with:
          ref: diffical
          path: overlay

      - name: Engine
        uses: actions/checkout@v4
        with:
          repository: micmtop/diffical
          ref: master
          path: engine

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - name: Build engine
        shell: bash
        run: cargo build --release --manifest-path engine/rust/Cargo.toml

      - name: Apply Diffical
        shell: bash
        run: python overlay/apply.py upstream

      - name: Publish (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          dotnet publish upstream/OpenUtau -c Release -r ${{ matrix.rid }} --self-contained true -o out/${{ matrix.name }}
          bash overlay/mac/make_app.sh out/${{ matrix.name }} out/OpenUtau.app
          ROOT=out/OpenUtau.app/Contents/Resources/Diffical

      - name: Publish (win/linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          dotnet publish upstream/OpenUtau -c Release -r ${{ matrix.rid }} --self-contained true -o out/${{ matrix.name }}

      - name: Assemble
        shell: bash
        run: |
          set -e
          BIN=$(find engine/rust/target/release -maxdepth 1 -name 'diffical-cli*' | head -1)
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            ROOT=out/OpenUtau.app/Contents/Resources/Diffical
            mkdir -p "$ROOT/backend" "$ROOT/models"
            cp "$BIN" "$ROOT/backend/diffical-backend"
            chmod +x "$ROOT/backend/diffical-backend"
          else
            ROOT=out/${{ matrix.name }}/Diffical
            mkdir -p "$ROOT/backend" "$ROOT/models"
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              cp "$BIN" "$ROOT/backend/diffical-backend.exe"
            else
              cp "$BIN" "$ROOT/backend/diffical-backend"
              chmod +x "$ROOT/backend/diffical-backend"
            fi
          fi
          cat > "$ROOT/config.json" <<'JSON'
          {
            "server": { "host": "127.0.0.1", "port": 8573 },
            "engine": { "auto_start": true, "hnsep_mode": "window", "execution_provider": "cpu", "dump_stages": false, "rms_target": 0.13 },
            "models": { "assembler": "models/assembler.onnx", "vocoder": "models/vocoder.onnx", "hnsep": "models/hnsep.onnx" }
          }
          JSON
          curl -fL --retry 3 -o "$ROOT/models/assembler.onnx" https://github.com/micmtop/diffical/releases/download/weights-v1/pointer_fix_single.onnx
          curl -fL --retry 3 -o "$ROOT/models/vocoder.onnx" "https://github.com/micmtop/diffical/releases/download/weights-v1/model.onnx"
          curl -fL --retry 3 -o "$ROOT/models/hnsep.onnx" https://github.com/micmtop/diffical/releases/download/weights-v1/hnsep.onnx || true

      - name: Zip
        shell: bash
        run: |
          set -e
          mkdir -p dist
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            ditto -c -k --sequesterRsrc --keepParent out/OpenUtau.app dist/OpenUtau-Diffical-${{ matrix.name }}.zip
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a dist/OpenUtau-Diffical-${{ matrix.name }}.zip ./out/${{ matrix.name }}/* >/dev/null
          else
            tar -C out/${{ matrix.name }} -czf dist/OpenUtau-Diffical-${{ matrix.name }}.tar.gz .
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Diffical-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
